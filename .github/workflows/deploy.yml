name: Deploy StoreManager to AWS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Published GHCR image tag (sha-xxxxxxxxxxxx)"
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: storemanager-ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^sha-[a-f0-9]{12}$ ]]; then
            echo "Invalid image tag"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1

      - name: Send deployment command
        id: deploy
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          PARAMS=$(jq -n \
            --arg tag "$IMAGE_TAG" \
            '{commands: [("/home/ubuntu/storemanager/deploy.sh " + $tag)]}')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "StoreManager deployment" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" \
            --output text)

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"
          echo "Deployment command submitted: $COMMAND_ID"

      - name: Wait and verify deployment
        env:
          INSTANCE_ID: ${{ vars.AWS_EC2_INSTANCE_ID }}
          COMMAND_ID: ${{ steps.deploy.outputs.command_id }}
        run: |
          if aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            echo "Remote deployment completed successfully"
          else
            echo "Remote deployment failed or timed out"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query '{Status:Status,Details:StatusDetails,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json